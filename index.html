<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場演講記錄員 (LectureScribe AI)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .pulse-ring {
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.08); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-microphone-lines text-emerald-400 text-xl"></i>
      <h1 class="text-lg font-bold">現場演講記錄員</h1>
    </div>
    <div id="micStatus" class="text-xs px-2 py-1 rounded bg-slate-700 text-slate-300">
      待命
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col gap-4">
    <!-- 收音狀態與即時音量回饋卡片 -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span class="text-sm text-slate-300 font-medium">現場收音監控</span>
        <span id="volumeDbText" class="text-xs text-slate-400">音量：靜音</span>
      </div>

      <!-- 即時跳動音量條 -->
      <div class="w-full bg-slate-950 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
        <div id="volumeBar" class="bg-emerald-500 h-full rounded-full transition-all duration-75 w-0"></div>
      </div>
      <div class="text-[11px] text-slate-400 flex justify-between">
        <span>微弱/安靜</span>
        <span class="text-emerald-400 font-semibold">演講正常聲量</span>
        <span class="text-rose-400">爆音</span>
      </div>

      <div class="flex gap-2 mt-2">
        <button id="toggleBtn" onclick="toggleListening()" class="flex-1 py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-lg">
          <i class="fa-solid fa-play"></i>
          <span>開始收音聆聽</span>
        </button>
        <button onclick="clearTranscript()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-lg text-sm">
          清空
        </button>
      </div>
    </div>

    <!-- 標籤速記 -->
    <div class="flex gap-2 overflow-x-auto py-1">
      <button onclick="insertTag('⭐ 重要論點')" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-full text-xs shrink-0 hover:bg-amber-500/30">⭐ 重要論點</button>
      <button onclick="insertTag('❓ 提問/反思')" class="bg-sky-500/20 text-sky-300 border border-sky-500/30 px-3 py-1.5 rounded-full text-xs shrink-0 hover:bg-sky-500/30">❓ 提問/反思</button>
      <button onclick="insertTag('💡 行動點子')" class="bg-purple-500/20 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-full text-xs shrink-0 hover:bg-purple-500/30">💡 行動點子</button>
    </div>

    <!-- 逐字稿顯示區 -->
    <div class="bg-slate-800 rounded-xl p-4 border border-slate-700 flex-1 min-h-[300px] flex flex-col">
      <div class="text-xs text-slate-400 border-b border-slate-700 pb-2 mb-3 flex justify-between">
        <span>即時文字轉譯</span>
        <span id="charCount">0 字</span>
      </div>
      <div id="transcriptBox" class="flex-1 overflow-y-auto space-y-3 text-sm leading-relaxed max-h-[45vh]">
        <div class="text-slate-500 text-center py-10" id="placeholderTip">點擊上方「開始收音聆聽」開始記錄</div>
      </div>
      <div id="interimText" class="text-xs text-emerald-400 italic mt-2 min-h-[1.5em]"></div>
    </div>
  </main>

  <script>
    let recognition = null;
    let isListening = false;
    let audioContext = null;
    let analyser = null;
    let microphoneStream = null;
    let animFrame = null;
    let fullTranscript = [];

    // 初始化語音辨識
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-TW';

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const item = event.results[i];
          if (item.isFinal) {
            const finalTxt = item[0].transcript.trim();
            if (finalTxt) {
              appendFinalText(finalTxt);
            }
          } else {
            interim += item[0].transcript;
          }
        }
        document.getElementById('interimText').textContent = interim ? `正在辨識：${interim}` : '';
      };

      recognition.onerror = (e) => {
        console.warn('Recognition error:', e.error);
        if (e.error === 'no-speech') {
          // 演講中停頓屬正常現象，不強制中斷
          return;
        }
        updateStatus('辨識異常：' + e.error, 'bg-rose-700 text-white');
      };

      recognition.onend = () => {
        if (isListening) {
          // 若非手動停止，自動重新連線以確保持續收音
          try { recognition.start(); } catch(err) {}
        }
      };
    }

    // 啟動高敏度收音並監聽音量
    async function startAudioMonitoring() {
      try {
        // 設定強制關閉回音與過度降噪，最大化收音敏感度
        const audioConstraints = {
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: true
          }
        };

        microphoneStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(microphoneStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const volumeBar = document.getElementById('volumeBar');
        const volumeDbText = document.getElementById('volumeDbText');

        function checkVolume() {
          if (!isListening) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          let average = sum / dataArray.length;
          // 計算音量百分比 (放大倍率以利觀察微弱訊號)
          let pct = Math.min(100, Math.round((average / 128) * 100 * 2.5));
          volumeBar.style.width = pct + '%';

          if (pct > 60) {
            volumeBar.className = 'bg-rose-500 h-full rounded-full transition-all duration-75';
            volumeDbText.textContent = `收音狀態：良好 (${pct}%)`;
          } else if (pct > 15) {
            volumeBar.className = 'bg-emerald-500 h-full rounded-full transition-all duration-75';
            volumeDbText.textContent = `收音狀態：正常 (${pct}%)`;
          } else {
            volumeBar.className = 'bg-amber-500 h-full rounded-full transition-all duration-75';
            volumeDbText.textContent = `收音微弱/環境安靜 (${pct}%)`;
          }

          animFrame = requestAnimationFrame(checkVolume);
        }
        checkVolume();
      } catch (err) {
        console.error('無法啟動麥克風監測:', err);
      }
    }

    function stopAudioMonitoring() {
      if (animFrame) cancelAnimationFrame(animFrame);
      if (microphoneStream) {
        microphoneStream.getTracks().forEach(t => t.stop());
        microphoneStream = null;
      }
      if (audioContext && audioContext.state !== 'closed') {
        audioContext.close();
      }
      document.getElementById('volumeBar').style.width = '0%';
      document.getElementById('volumeDbText').textContent = '音量：已停止';
    }

    async function toggleListening() {
      if (!SpeechRecognition) {
        alert('您的瀏覽器不支援 Web Speech API，建議使用 Android Chrome 開啟。');
        return;
      }

      const btn = document.getElementById('toggleBtn');
      if (!isListening) {
        try {
          await startAudioMonitoring();
          recognition.start();
          isListening = true;
          btn.innerHTML = '<i class="fa-solid fa-stop"></i><span>停止記錄</span>';
          btn.className = 'flex-1 py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-500 text-white transition-all shadow-lg pulse-ring';
          updateStatus('收音中', 'bg-emerald-600 text-white');
        } catch (err) {
          alert('請允許麥克風使用權限以進行收音');
        }
      } else {
        isListening = false;
        recognition.stop();
        stopAudioMonitoring();
        btn.innerHTML = '<i class="fa-solid fa-play"></i><span>繼續收音聆聽</span>';
        btn.className = 'flex-1 py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white transition-all shadow-lg';
        updateStatus('已暫停', 'bg-slate-700 text-slate-300');
        document.getElementById('interimText').textContent = '';
      }
    }

    function appendFinalText(text) {
      document.getElementById('placeholderTip')?.remove();
      const box = document.getElementById('transcriptBox');
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];

      const item = document.createElement('div');
      item.className = 'bg-slate-950/60 p-2.5 rounded-lg border border-slate-700/60';
      item.innerHTML = `<span class="text-xs text-slate-400 font-mono select-none mr-2">[${timeStr}]</span><span>${text}</span>`;
      box.appendChild(item);
      box.scrollTop = box.scrollHeight;

      fullTranscript.push(`[${timeStr}] ${text}`);
      updateCharCount();
    }

    function insertTag(tagName) {
      appendFinalText(`【標記：${tagName}】`);
    }

    function clearTranscript() {
      if (!confirm('確定要清空目前所有內容嗎？')) return;
      document.getElementById('transcriptBox').innerHTML = '<div class="text-slate-500 text-center py-10" id="placeholderTip">點擊上方「開始收音聆聽」開始記錄</div>';
      fullTranscript = [];
      updateCharCount();
    }

    function updateCharCount() {
      const len = fullTranscript.join('').length;
      document.getElementById('charCount').textContent = `${len} 字`;
    }

    function updateStatus(text, cls) {
      const st = document.getElementById('micStatus');
      st.textContent = text;
      st.className = `text-xs px-2 py-1 rounded font-medium ${cls}`;
    }
  </script>
</body>
</html>
